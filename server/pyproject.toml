[project]
name = "stockit"
version = "0.1.0"
description = "AI Investment System V3 - Strategy iteration & auto-review platform"
requires-python = ">=3.12"
readme = "README.md"
dependencies = [
    "akshare>=1.18.70",
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
    "pyjwt>=2.10.0",
    "pydantic>=2.0.0",
    "baostock>=0.9.3",
    "supabase>=2.31.0",
    "python-dotenv>=1.2.2",
    "inngest>=0.5.19",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
